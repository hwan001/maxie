version: '3.8'

services:
  backend:
    build:
      context: ./server
    restart: unless-stopped
    environment:
      - CORS_ALLOW_ORIGIN=https://fileopt.miiml.org
      - COOKIE_DOMAIN=fileopt.miiml.org
      - REDIRECT_URI=postmessage
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - JWT_SECRET=${JWT_SECRET:-}
    volumes:
      - fileoptimizer_data:/root/.fileoptimizer
    networks:
      - fileoptimizer-network

  frontend:
    build:
      context: ./web
      args:
        - REACT_APP_BASE_URL=https://backend/api
        - REACT_APP_GOOGLE_CLIENT_ID=${REACT_APP_GOOGLE_CLIENT_ID:-}
    restart: unless-stopped
    networks:
      - fileoptimizer-network

  nginx:
    build: ./nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
      - frontend
    networks:
      - fileoptimizer-network

volumes:
  fileoptimizer_data:

networks:
  fileoptimizer-network:
    driver: bridge
