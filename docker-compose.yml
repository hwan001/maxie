version: '3.8'

services:
  backend:
    build:
      context: ./server
    restart: unless-stopped
    environment:
      - CORS_ALLOW_ORIGIN=${CORS_ALLOW_ORIGIN:-http://localhost:8080}
      - COOKIE_DOMAIN=${COOKIE_DOMAIN:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - REDIRECT_URI=${REDIRECT_URI:-http://localhost:8080}
      - JWT_SECRET=${JWT_SECRET:-dev-jwt-secret-change-me}
      - SESSION_SECRET=${SESSION_SECRET:-dev-session-secret-change-me}
    volumes:
      # agent 등록 정보 및 파일 DB를 컨테이너 재시작 후에도 유지
      - maxie_data:/root/.maxie
    networks:
      - maxie-network

  frontend:
    build:
      context: ./web
      args:
        - REACT_APP_GOOGLE_CLIENT_ID=${REACT_APP_GOOGLE_CLIENT_ID:-}
    restart: unless-stopped
    networks:
      - maxie-network

  nginx:
    build: ./nginx
    restart: unless-stopped
    ports:
      - "${EXPOSE_PORT:-8080}:80"
    depends_on:
      - backend
      - frontend
    networks:
      - maxie-network

volumes:
  maxie_data:

networks:
  maxie-network:
    driver: bridge
