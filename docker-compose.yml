version: '3'
services:
  backend:
    build: ./server
    restart: unless-stopped
    volumes:
      - /home/user/client:/root/client
    networks:
      - fileoptimizer-network

  frontend:
    build: ./web
    restart: unless-stopped
    networks:
      - fileoptimizer-network

  nginx:
    build: ./nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
      - frontend
    networks:
      - fileoptimizer-network

networks:
  fileoptimizer-network :
    driver: bridge
